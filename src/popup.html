<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Structured Data Sniffer Popup</title>
    <style>
      body { font-family: sans-serif; min-width: 220px; margin: 12px; }
      .actions { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
      .help { margin-top: 16px; font-size: 0.9em; color: #666; }
    </style>
  </head>
  <body>
    <div>
      <strong>Structured Data Summary:</strong>
      <div id="summary" style="margin: 8px 0;">Loading...</div>
      <div class="actions">
        <button id="open-sidepanel">Open Side Panel</button>
        <button id="export-data">Export/Copy Data</button>
        <button id="open-settings">Settings</button>
      </div>
      <div class="help">
        <a href="https://github.com/mediaprophet/structured-data-sniffer" target="_blank">Help & Feedback</a>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
